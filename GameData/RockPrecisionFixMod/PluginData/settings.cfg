// How much Rock Precision Fix writes to KSP.log: Error, Warning, Info, Debug or Trace.
//   Info  - one line at startup, then one line per body the first time its scatter is hung from its quads.
//   Debug - adds one line per scatter holder hung from its quad, with how far it was drawn from it before.
//   Trace - adds one line per holder handed back to its pool when its quad is destroyed. Very verbose.
// Read once when KSP starts: quit KSP, edit this file, start KSP again.
logLevel = Info
